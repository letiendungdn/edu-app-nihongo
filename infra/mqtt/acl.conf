# ACL của Mosquitto. Không khớp dòng nào thì bị từ chối.

# api-gateway: publish/subscribe chat giữa các pod, publish thông báo tới user
user gateway
topic readwrite chat/#
topic write user/+/notify
topic read $SYS/#

# Client (web/app): username = userId, chỉ được đọc hộp thư của chính mình.
# %u là username lúc connect. Hiện chưa cấp tài khoản cho client;
# khi làm thì xác thực bằng JWT (vd. plugin mosquitto-go-auth) thay vì password file.
pattern read user/%u/notify
