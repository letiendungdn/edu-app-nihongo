# Broker nội bộ. api-gateway nối qua mạng Docker bằng tài khoản `gateway`.
# Mật khẩu lấy từ MQTT_GATEWAY_PASSWORD (infra/mqtt/entrypoint.sh tạo password file).
persistence true
persistence_location /mosquitto/data/
log_dest stdout

allow_anonymous false
password_file /mosquitto/passwd
acl_file /mosquitto/acl

listener 1883
protocol mqtt

listener 9001
protocol websockets
