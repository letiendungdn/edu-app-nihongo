# Lớp 3 — Reverse proxy (Docker Compose / tham chiếu cho K8s Ingress)
# Routing:
#   nihongo.*         → /api, /health → api-gateway | / → nihongo-web (React)
#   auth.*            → Keycloak

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name nihongo.localhost localhost 10.0.2.2;

    client_max_body_size 10m;

    # Healthcheck của chính nginx (không phụ thuộc gateway như /health)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok
";
    }

    # Upstream chưa nghe cổng (vừa khởi động lại Docker: gateway/web lên sau nginx)
    # → trả 503 + Retry-After thay vì 502 trơn; frontend tự thử lại.
    location @api_starting {
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        add_header Retry-After 5 always;
        add_header Cache-Control no-store always;
        return 503 '{"success":false,"error":{"code":"SERVICE_STARTING","message":"Máy chủ đang khởi động, vui lòng thử lại sau ít giây."}}';
    }

    location @web_starting {
        default_type text/html;
        charset utf-8;
        add_header Retry-After 5 always;
        add_header Cache-Control no-store always;
        return 503 '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta http-equiv="refresh" content="5"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đang khởi động…</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#0f172a;color:#f1f5f9;text-align:center}p{color:#94a3b8}</style></head><body><div><h1>Hệ thống đang khởi động…</h1><p>Trang sẽ tự tải lại sau vài giây.</p></div></body></html>';
    }

    # Route AI luyện câu nằm trên Next.js (Ollama local), không phải Nest gateway.
    location = /api/sentence-practice {
        set $nihongo_upstream nihongo-web:5173;
        proxy_pass http://$nihongo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        error_page 502 504 = @web_starting;
    }

    # API + Swagger (trực tiếp tới gateway, không qua Next.js rewrite)
    location /api/ {
        set $gateway_upstream api-gateway:3000;
        proxy_pass http://$gateway_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 502 504 = @api_starting;
    }

    location ^~ /health {   # /health, /health/live, /health/ready
        set $gateway_upstream api-gateway:3000;
        proxy_pass http://$gateway_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        error_page 502 504 = @api_starting;
    }

    # Android emulator gọi http://10.0.2.2:8080/... (Host = 10.0.2.2) — proxy Keycloak
    # để OIDC discovery/login không cần DNS auth.localhost trên máy ảo.
    location ~ ^/(realms|resources|js|robots\.txt)(/|$) {
        set $keycloak_upstream keycloak:8080;
        proxy_pass http://$keycloak_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host auth.localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host auth.localhost;
        proxy_set_header X-Forwarded-Port 8080;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Next.js frontend tiếng Nhật — dùng biến để Docker DNS cập nhật IP sau recreate container
    location / {
        set $nihongo_upstream nihongo-web:5173;
        proxy_pass http://$nihongo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        error_page 502 504 = @web_starting;
    }
}

server {
    listen 80;
    server_name auth.localhost;

    client_max_body_size 10m;

    location / {
        set $keycloak_upstream keycloak:8080;
        proxy_pass http://$keycloak_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8080;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
