# gRPC nội bộ — không expose ra Ingress
apiVersion: v1
kind: Service
metadata:
  name: content-service
  namespace: edu-app
  labels:
    app: content-service
    app.kubernetes.io/part-of: edu-platform
spec:
  type: ClusterIP
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc
      protocol: TCP
  selector:
    app: content-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-service
  namespace: edu-app
  labels:
    app: content-service
    app.kubernetes.io/part-of: edu-platform
spec:
  # Rolling update không gián đoạn: pod mới phải Ready trước khi gỡ pod cũ
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # Không đặt replicas: HPA (grpc-services-autoscaling.yaml) quyết định số pod, tối thiểu 2
  selector:
    matchLabels:
      app: content-service
  template:
    metadata:
      labels:
        app: content-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      # SIGTERM → app đóng gọn (enableShutdownHooks); preStop chờ Service/Ingress gỡ pod khỏi danh sách
      terminationGracePeriodSeconds: 30
      # Bảo mật (Trivy KSV-0118, KSV-0014): chạy bằng user thường, chặn leo quyền, bỏ mọi capability,
      # hệ thống file gốc chỉ đọc. Image đã đặt USER node (uid 1000). Xem docs/learn-devsecops.md.
      # App không gọi Kubernetes API: không gắn token ServiceAccount vào pod (lọt container cũng không dò được cluster)
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: content-service
          image: ghcr.io/letiendungdn/edu_app/content-service:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 50051
              name: grpc
          envFrom:
            - configMapRef:
                name: edu-app-config
          env:
            - name: SERVICE_NAME # tên service trong log (pino) và trace (Jaeger)
              value: content-service
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: edu-app-secrets
                  key: DATABASE_URL_NIHONGO
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
