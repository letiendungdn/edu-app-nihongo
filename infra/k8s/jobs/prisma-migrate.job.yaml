# Chạy `prisma migrate deploy` TRƯỚC khi cập nhật Deployment (xem .github/workflows/deploy.yml).
# Không nằm trong infra/k8s/*.yaml để vòng `kubectl apply` thường không chạy lại nó.
# __IMAGE_TAG__ / __JOB_SUFFIX__ được thay bằng git sha lúc deploy → mỗi lần deploy một Job mới.
apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate-__JOB_SUFFIX__
  namespace: edu-app
  labels:
    app: prisma-migrate
    app.kubernetes.io/part-of: edu-platform
spec:
  backoffLimit: 0 # migration lỗi thì dừng hẳn, không thử lại mù quáng
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: prisma-migrate
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      # Bảo mật (Trivy KSV-0118, KSV-0014): chạy bằng user thường, chặn leo quyền, bỏ mọi capability,
      # hệ thống file gốc chỉ đọc. Image đã đặt USER node (uid 1000). Xem docs/learn-devsecops.md.
      # App không gọi Kubernetes API: không gắn token ServiceAccount vào pod (lọt container cũng không dò được cluster)
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: migrate
          image: ghcr.io/letiendungdn/edu_app/migrator:__IMAGE_TAG__
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            # Hệ thống file chỉ đọc: Prisma CLI ghi cache vào $HOME, trỏ sang /tmp (emptyDir, ghi được)
            - name: HOME
              value: /tmp
            - name: CHECKPOINT_DISABLE # tắt việc Prisma gọi ra ngoài kiểm tra phiên bản
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: edu-app-secrets
                  key: DATABASE_URL_NIHONGO
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
