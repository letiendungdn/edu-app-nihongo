apiVersion: v1
kind: ConfigMap
metadata:
  name: edu-app-config
  namespace: edu-app
  labels:
    app.kubernetes.io/part-of: edu-platform
data:
  NODE_ENV: production

  # api-gateway
  PORT: "3000"
  CONTENT_GRPC_URL: content-service:50051
  EXAM_GRPC_URL: exam-service:50052
  JWT_EXPIRES_IN: 7d
  ALLOWED_ORIGINS: "https://nihongo.example.com"
  ADMIN_EMAIL: admin@nihongo.local

  # gRPC workers
  CONTENT_GRPC_PORT: "50051"
  EXAM_GRPC_PORT: "50052"
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: kafka:9092
  # Mosquitto (infra/k8s/mqtt/mosquitto.yaml); mật khẩu ở Secret MQTT_PASSWORD
  MQTT_URL: mqtt://mosquitto:1883
  MQTT_USERNAME: gateway

  # nihongo-web
  API_URL: http://api-gateway:3000

  # postgres (non-secret)
  POSTGRES_USER: nihongo
  POSTGRES_DB: nihongo

  # Ingress hostnames — cập nhật theo domain thực tế
  INGRESS_HOST_NIHONGO: nihongo.example.com
