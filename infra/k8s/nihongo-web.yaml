apiVersion: v1
kind: Service
metadata:
  name: nihongo-web
  namespace: edu-app
  labels:
    app: nihongo-web
    app.kubernetes.io/part-of: edu-platform
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: nihongo-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nihongo-web
  namespace: edu-app
  labels:
    app: nihongo-web
    app.kubernetes.io/part-of: edu-platform
spec:
  # Rolling update không gián đoạn: pod mới phải Ready trước khi gỡ pod cũ
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  replicas: 1
  selector:
    matchLabels:
      app: nihongo-web
  template:
    metadata:
      labels:
        app: nihongo-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      # SIGTERM → app đóng gọn (enableShutdownHooks); preStop chờ Service/Ingress gỡ pod khỏi danh sách
      terminationGracePeriodSeconds: 30
      # Bảo mật (Trivy KSV-0118, KSV-0014): chạy bằng user thường, chặn leo quyền, bỏ mọi capability,
      # hệ thống file gốc chỉ đọc. Image đã đặt USER node (uid 1000). Xem docs/learn-devsecops.md.
      # App không gọi Kubernetes API: không gắn token ServiceAccount vào pod (lọt container cũng không dò được cluster)
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
      containers:
        - name: nihongo-web
          image: ghcr.io/letiendungdn/edu_app/nihongo-web:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/apps/nihongo-web/.next/cache
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: edu-app-config
          env:
            # ConfigMap chung có PORT=3000 (của gateway). Biến trong `env` thắng `envFrom`,
            # nên phải đặt lại, nếu không Next.js nghe 3000 trong khi probe/Service gọi 8080.
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
