apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: edu-app
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: edu-platform
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: edu-app
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: edu-platform
spec:
  # Rolling update không gián đoạn: pod mới phải Ready trước khi gỡ pod cũ
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # Không đặt replicas: HPA (api-gateway-hpa.yaml) quyết định số pod — apply lại không ép về 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      # SIGTERM → app đóng gọn (enableShutdownHooks); preStop chờ Service/Ingress gỡ pod khỏi danh sách
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-gateway
          image: ghcr.io/letiendungdn/edu_app/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: edu-app-config
          env:
            - name: SERVICE_NAME # tên service trong log (pino) và trace (Jaeger)
              value: api-gateway
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: edu-app-secrets
                  key: DATABASE_URL_NIHONGO
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: edu-app-secrets
                  key: JWT_SECRET
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edu-app-secrets
                  key: ADMIN_PASSWORD
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edu-app-secrets
                  key: MQTT_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
