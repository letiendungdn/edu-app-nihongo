{{- if .Values.podDisruptionBudget.enabled }}
{{- range $name := list "api-gateway" "content-service" "exam-service" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ include "edu-app.namespace" $ }}
  labels:
    app: {{ $name }}
    {{- include "edu-app.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: {{ $name }}
{{- end }}
{{- end }}
