apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ include "edu-app.namespace" . }}
  labels:
    app: api-gateway
    {{- include "edu-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ include "edu-app.namespace" . }}
  labels:
    app: api-gateway
    {{- include "edu-app.labels" . | nindent 4 }}
spec:
  # Rolling update không gián đoạn: pod mới phải Ready trước khi gỡ pod cũ
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- if not .Values.hpa.apiGateway.enabled }}
  replicas: {{ .Values.replicaCount.apiGateway }}
  {{- end }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # SIGTERM → app đóng gọn (enableShutdownHooks); preStop chờ Service/Ingress gỡ pod khỏi danh sách
      terminationGracePeriodSeconds: 30
      # Bảo mật (Trivy KSV-0118, KSV-0014): chạy bằng user thường, chặn leo quyền, bỏ mọi capability,
      # hệ thống file gốc chỉ đọc. Image đã đặt USER node (uid 1000). Xem docs/learn-devsecops.md.
      # App không gọi Kubernetes API: không gắn token ServiceAccount vào pod (lọt container cũng không dò được cluster)
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: api-gateway
          image: {{ include "edu-app.image" (dict "service" "api-gateway" "Values" .Values "Chart" .Chart) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "edu-app.configMapName" . }}
          env:
            - name: SERVICE_NAME # tên service trong log (pino) và trace (Jaeger)
              value: api-gateway
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "edu-app.secretName" . }}
                  key: DATABASE_URL_NIHONGO
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "edu-app.secretName" . }}
                  key: JWT_SECRET
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "edu-app.secretName" . }}
                  key: ADMIN_PASSWORD
          resources:
            {{- toYaml .Values.resources.apiGateway | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
