name: edu-app

networks:
  default:
    name: edu-app_default

services:
  redis:
    image: redis:7-alpine
    container_name: edu-redis
    hostname: redis
    restart: unless-stopped
    # Không publish ra host — tránh Docker Desktop (Windows) làm Redis
    # mất endpoint trên edu-app_default (Networks: {}) sau sleep/restart.
    expose:
      - '6379'
    networks:
      default:
        aliases:
          - redis
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  mongodb:
    image: mongo:7-jammy
    container_name: edu-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: nihongo_audit
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: edu-zookeeper
    restart: unless-stopped
    ports:
      - '2181:2181'
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ['CMD-SHELL', 'echo srvr | nc localhost 2181 | grep -q Mode']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: edu-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - '9092:9093'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server', 'localhost:9092']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  postgres-nihongo:
    image: postgres:16-alpine
    container_name: edu-postgres-nihongo
    restart: unless-stopped
    environment:
      POSTGRES_USER: nihongo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nihongo}
      POSTGRES_DB: nihongo
    ports:
      - '5433:5432'
    volumes:
      - postgres_nihongo_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nihongo -d nihongo']
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:10
    container_name: edu-flyway
    command: -connectRetries=60 migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres-nihongo:5432/nihongo
      FLYWAY_USER: nihongo
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-nihongo}
      # Bảng lịch sử nằm schema riêng để Prisma không thấy drift trong public.
      # Schema flyway mới tạo nên trống, không cần baseline.
      FLYWAY_DEFAULT_SCHEMA: flyway
      FLYWAY_SCHEMAS: flyway
    volumes:
      - ./infra/flyway/sql:/flyway/sql:ro
    depends_on:
      postgres-nihongo:
        condition: service_healthy
    restart: "no"

  postgres-keycloak:
    image: postgres:16-alpine
    container_name: edu-postgres-keycloak
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      POSTGRES_DB: keycloak
    ports:
      - '5435:5432'
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak -d keycloak']
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: edu-keycloak
    restart: unless-stopped
    command: ['start-dev', '--import-realm']
    ports:
      - '8081:8080'
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME_URL: http://auth.localhost:${NGINX_HTTP_PORT:-8080}
      KC_HOSTNAME_ADMIN_URL: http://auth.localhost:${NGINX_HTTP_PORT:-8080}
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/keycloak/realm-edu-app.json:/opt/keycloak/data/import/realm-edu-app.json:ro
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/8080']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  content-service:
    build:
      context: .
      dockerfile: services/content-service/Dockerfile
    container_name: edu-content
    restart: unless-stopped
    ports:
      - '50051:50051'
    environment:
      DATABASE_URL: postgresql://nihongo:${POSTGRES_PASSWORD:-nihongo}@postgres-nihongo:5432/nihongo
      REDIS_URL: redis://redis:6379
      CONTENT_GRPC_PORT: 50051
      SERVICE_NAME: content-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres-nihongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  exam-service:
    build:
      context: .
      dockerfile: services/exam-service/Dockerfile
    container_name: edu-exam
    restart: unless-stopped
    ports:
      - '50052:50052'
    environment:
      DATABASE_URL: postgresql://nihongo:${POSTGRES_PASSWORD:-nihongo}@postgres-nihongo:5432/nihongo
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      EXAM_GRPC_PORT: 50052
      SERVICE_NAME: exam-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres-nihongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: edu-gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      CONTENT_GRPC_URL: content-service:50051
      EXAM_GRPC_URL: exam-service:50052
      DATABASE_URL: postgresql://nihongo:${POSTGRES_PASSWORD:-nihongo}@postgres-nihongo:5432/nihongo
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET chua dat - xem .env (api-gateway khong chay voi secret mac dinh)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://auth.localhost:8080/realms/edu-app}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-edu-app}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://nihongo.localhost:8080,http://auth.localhost:8080,http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nihongo.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-noreply@nihongo.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Nihongo EDU}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://nihongo.localhost:8080}
      SERVICE_NAME: api-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      SENTRY_DSN: ${SENTRY_DSN:-}
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: gateway
      MQTT_PASSWORD: ${MQTT_GATEWAY_PASSWORD:-gateway-dev}
      MONGODB_URL: mongodb://mongodb:27017/nihongo_audit
      KAFKA_BROKERS: kafka:9092
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-edu-app-dev}
      LIVEKIT_URL: ${LIVEKIT_URL:-http://livekit:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      # AI local trên Mac host (Ollama). host.docker.internal = máy chạy Docker Desktop.
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      LOCAL_AI_BASE_URL: ${LOCAL_AI_BASE_URL:-http://host.docker.internal:11434}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-qwen2.5:7b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    # /health/live không gọi DB/service khác — chỉ báo process Nest đã nghe cổng 3000.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:3000/health/live || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
      start_interval: 3s
    depends_on:
      postgres-nihongo:
        condition: service_healthy
      content-service:
        condition: service_started
      exam-service:
        condition: service_started
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      mosquitto:
        condition: service_healthy
      livekit:
        condition: service_started
      keycloak:
        condition: service_started

  livekit:
    image: livekit/livekit-server:v1.8
    container_name: edu-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml --dev
    ports:
      - '7880:7880'
      - '7881:7881'
      - '50100-50200:50100-50200/udp'
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro

  signaling-service:
    build:
      context: .
      dockerfile: services/signaling-service/Dockerfile
    container_name: edu-signaling
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      PORT: 3002
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET chua dat - xem .env (api-gateway khong chay voi secret mac dinh)}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${SIGNALING_CORS_ORIGIN:-http://localhost:8080,http://localhost:5173,http://nihongo.localhost:8080}
    depends_on:
      redis:
        condition: service_healthy

  nihongo-web:
    build:
      context: .
      dockerfile: apps/nihongo-web/Dockerfile
      args:
        NEXT_PUBLIC_SIGNALING_URL: ${NEXT_PUBLIC_SIGNALING_URL:-http://localhost:3002}
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://auth.localhost:8080}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-edu-app}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-nihongo-web}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    container_name: edu-nihongo-web
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      API_URL: http://api-gateway:3000
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      LOCAL_AI_BASE_URL: ${LOCAL_AI_BASE_URL:-http://host.docker.internal:11434}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-qwen2.5:7b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./apps/nihongo-web/public/media/book-audio:/app/apps/nihongo-web/public/media/book-audio
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:5173/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 3s
    depends_on:
      - api-gateway

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    container_name: edu-nginx
    restart: unless-stopped
    ports:
      - '${NGINX_HTTP_PORT:-8080}:80'
    # Chỉ có tác dụng với `docker compose up`. Khi Docker Desktop tự bật lại container
    # (restart: unless-stopped) thì không theo thứ tự này — nginx.conf xử lý khoảng chờ đó.
    depends_on:
      api-gateway:
        condition: service_healthy
      nihongo-web:
        condition: service_healthy
      keycloak:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: edu-jaeger
    restart: unless-stopped
    ports:
      - '16686:16686'
      - '4318:4318'
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: edu-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - api-gateway

  grafana:
    image: grafana/grafana:10.4.0
    container_name: edu-grafana
    restart: unless-stopped
    ports:
      - '4000:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # Nhận alert từ Prometheus → gửi email (letiendungdt@gmail.com). Xem infra/alertmanager/README.md
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: edu-alertmanager
    restart: unless-stopped
    ports:
      - '9093:9093'
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      # Mặc định gửi vào Mailpit (local); gửi thật: ALERTMANAGER_CONFIG=./infra/alertmanager/alertmanager.smtp.yml
      - ${ALERTMANAGER_CONFIG:-./infra/alertmanager/alertmanager.local.yml}:/etc/alertmanager/alertmanager.yml:ro
      - ./infra/alertmanager/secrets:/etc/alertmanager/secrets:ro
    depends_on:
      - mailpit

  # Hộp thư giả cho dev: bắt mọi mail SMTP, xem ở http://localhost:8025 (không gửi ra Internet)
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: edu-mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: edu-mosquitto
    restart: unless-stopped
    # Tạo password file từ env rồi mới start broker (xem infra/mqtt/entrypoint.sh)
    entrypoint: ['/bin/sh', '/mosquitto/entrypoint.sh']
    environment:
      MQTT_GATEWAY_PASSWORD: ${MQTT_GATEWAY_PASSWORD:-gateway-dev}
    # Chỉ mở trên máy local, không ra mạng LAN
    ports:
      - '127.0.0.1:1883:1883'
      - '127.0.0.1:9001:9001'
    volumes:
      - ./infra/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mqtt/acl.conf:/mosquitto/config/acl.conf:ro
      - ./infra/mqtt/entrypoint.sh:/mosquitto/entrypoint.sh:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ['CMD-SHELL', 'mosquitto_sub -h 127.0.0.1 -u gateway -P "$$MQTT_GATEWAY_PASSWORD" -t \$$SYS/broker/uptime -C 1 -W 3']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mosquitto_data:
  # Giữ data từ stack cũ `nihongo-app` (chỉ DB tiếng Nhật)
  postgres_nihongo_data:
    external: true
    name: nihongo-app_postgres_data
  postgres_keycloak_data:
  mongodb_data:
  grafana_data:
