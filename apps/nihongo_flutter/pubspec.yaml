name: nihongo_app
description: EDU APP — học tiếng Nhật offline-first (Flutter)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.0
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  connectivity_plus: ^7.0.0
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.0
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.4
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  livekit_client: 2.10.0
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  shared_preferences: ^2.3.2
  flutter_appauth: ^8.0.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.3
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
