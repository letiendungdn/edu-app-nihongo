name: DAST

# Quét app ĐANG CHẠY bằng OWASP ZAP baseline (thụ động, không tấn công phá hoại).
# Chạy tay vào staging sau khi deploy. Không quét production của người khác — chỉ URL bạn sở hữu.
on:
  workflow_dispatch:
    inputs:
      target:
        description: URL cần quét (ví dụ https://staging.example.com/)
        required: true

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ZAP baseline
        env:
          TARGET: ${{ inputs.target }}
        run: bash infra/security/zap-baseline.sh "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-report
          path: infra/security/reports/
