name: Deploy

# Chỉ deploy khi workflow CI trên main đã XANH (trước đây deploy chạy song song với CI → test đỏ vẫn lên production).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/letiendungdn/edu_app
  # Commit đã qua CI (workflow_run) hoặc commit hiện tại (chạy tay). Image gắn đúng tag này.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign ký keyless bằng token OIDC của GitHub, không cần giữ khóa riêng
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            dockerfile: services/api-gateway/Dockerfile
          - name: content-service
            dockerfile: services/content-service/Dockerfile
          - name: exam-service
            dockerfile: services/exam-service/Dockerfile
          - name: nihongo-web
            dockerfile: apps/nihongo-web/Dockerfile
          - name: migrator
            dockerfile: packages/prisma-nihongo/Dockerfile.migrate
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.DEPLOY_SHA }} # build đúng commit CI đã kiểm tra

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Chuỗi cung ứng: đính kèm SBOM (danh sách thành phần) và provenance (build từ commit nào, workflow nào)
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Ký image theo digest (không theo tag, vì tag đổi được). Keyless: chữ ký gắn với danh tính workflow này,
      # ghi vào log minh bạch Rekor. Bước deploy kiểm chữ ký trước khi chạy.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign image (cosign keyless)
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      # Lưu SBOM ra artifact để đọc / tra CVE mới sau này mà không cần build lại
      - name: Export SBOM
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE" --format '{{ json .SBOM }}' > "sbom-${{ matrix.name }}.spdx.json"
          test -s "sbom-${{ matrix.name }}.spdx.json"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json
          retention-days: 90

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # Chỉ deploy image do CHÍNH workflow này ký, từ repo này. Image bị thay trên registry → dừng.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Verify image signatures
        run: |
          for name in api-gateway content-service exam-service nihongo-web migrator; do
            cosign verify "${IMAGE_PREFIX}/${name}:${DEPLOY_SHA}" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/deploy\.yml@" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "✓ ${name} đã ký hợp lệ"
          done

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Configure kubeconfig
        id: kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          # Không có secret thì kubectl mặc định gọi http://localhost:8080 và fail
          # "connection refused" dù manifest đúng.
          if [ -z "$KUBE_CONFIG" ]; then
            echo "has_cluster=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secret KUBE_CONFIG trống — bỏ qua deploy Kubernetes. Thêm kubeconfig (nội dung file hoặc base64) vào environment production khi đã có cluster."
            exit 0
          fi
          echo "has_cluster=true" >> "$GITHUB_OUTPUT"
          mkdir -p "$HOME/.kube"
          if printf '%s' "$KUBE_CONFIG" | grep -q 'apiVersion:'; then
            printf '%s\n' "$KUBE_CONFIG" > "$HOME/.kube/config"
          else
            printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Apply namespace
        if: steps.kubeconfig.outputs.has_cluster == 'true'
        run: kubectl apply -f infra/k8s/namespace.yaml

      # Bảo mật: secret đi qua env, KHÔNG chèn ${{ secrets.X }} thẳng vào script (giá trị có " hoặc $(...) sẽ
      # phá lệnh / chạy lệnh lạ), và không nằm trên dòng lệnh (--from-literal lộ qua `ps`). Ghi ra file
      # quyền 600 trong RUNNER_TEMP rồi xóa ngay. Xem docs/adr/0008-secrets-management.md.
      - name: Sync secrets from GitHub Secrets
        if: steps.kubeconfig.outputs.has_cluster == 'true'
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL_NIHONGO: ${{ secrets.DATABASE_URL_NIHONGO }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
          # Kubelet kéo image bất cứ lúc nào (scale, node mới) → cần token SỐNG LÂU, chỉ quyền read:packages.
          # GITHUB_TOKEN hết hạn ngay khi job xong nên chỉ dùng tạm khi chưa tạo GHCR_PULL_TOKEN (ADR-0008).
          GHCR_PULL_USER: ${{ vars.GHCR_PULL_USER || github.repository_owner }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_FALLBACK_USER: ${{ github.actor }}
        run: |
          umask 077
          env_file="$RUNNER_TEMP/edu-app-secrets.env"
          trap 'rm -f "$env_file"' EXIT
          for k in POSTGRES_PASSWORD DATABASE_URL_NIHONGO JWT_SECRET ADMIN_PASSWORD MQTT_PASSWORD; do
            printf '%s=%s\n' "$k" "${!k}" >> "$env_file"
          done
          kubectl create secret generic edu-app-secrets \
            --namespace edu-app \
            --from-env-file="$env_file" \
            --dry-run=client -o yaml | kubectl apply -f -

          if [ -n "$GHCR_PULL_TOKEN" ]; then
            pull_user="$GHCR_PULL_USER"; pull_token="$GHCR_PULL_TOKEN"
          else
            echo "::warning::Chưa có secret GHCR_PULL_TOKEN: dùng tạm GITHUB_TOKEN, hết hạn khi job xong → pod tạo sau có thể ImagePullBackOff. Tạo PAT (classic) chỉ quyền read:packages."
            pull_user="$GHCR_FALLBACK_USER"; pull_token="$GHCR_FALLBACK_TOKEN"
          fi
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace edu-app \
            --docker-server=ghcr.io \
            --docker-username="$pull_user" \
            --docker-password="$pull_token" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Postgres/Redis phải có trước khi migrate (lần deploy đầu tiên).
      # Mosquitto cũng apply ở đây vì api-gateway đọc MQTT_URL từ configmap.
      - name: Apply data stores
        if: steps.kubeconfig.outputs.has_cluster == 'true'
        run: |
          kubectl apply -f infra/k8s/postgres.yaml -f infra/k8s/redis.yaml -f infra/k8s/mqtt/mosquitto.yaml
          kubectl rollout status statefulset/postgres -n edu-app --timeout=300s

      # Migration TRƯỚC khi đổi code: lỗi → dừng deploy, pod đang chạy không bị đụng tới
      - name: Migrate database
        if: steps.kubeconfig.outputs.has_cluster == 'true'
        run: |
          JOB_SUFFIX="${DEPLOY_SHA:0:12}"
          sed -e "s/__IMAGE_TAG__/${DEPLOY_SHA}/" -e "s/__JOB_SUFFIX__/${JOB_SUFFIX}/" \
            infra/k8s/jobs/prisma-migrate.job.yaml | kubectl apply -f -
          if ! kubectl wait --for=condition=complete "job/prisma-migrate-${JOB_SUFFIX}" -n edu-app --timeout=600s; then
            kubectl logs "job/prisma-migrate-${JOB_SUFFIX}" -n edu-app || true
            exit 1
          fi
          kubectl logs "job/prisma-migrate-${JOB_SUFFIX}" -n edu-app

      # Image đổi sang tag bất biến :<sha> ngay khi apply → mỗi deploy là một revision rollout thật
      # (:latest cũ làm `kubectl apply` báo unchanged, pod vẫn chạy code cũ).
      - name: Deploy workloads (pinned to commit sha)
        if: steps.kubeconfig.outputs.has_cluster == 'true'
        run: |
          for f in infra/k8s/*.yaml; do
            case "$(basename "$f")" in
              secret.yaml|secrets.yaml.example) continue ;;
            esac
            sed "s#\(${IMAGE_PREFIX}/[a-z-]*\):latest#\1:${DEPLOY_SHA}#g" "$f" | kubectl apply -f -
          done

      - name: Wait for rollouts (rollback on failure)
        if: steps.kubeconfig.outputs.has_cluster == 'true'
        run: |
          for d in api-gateway content-service exam-service nihongo-web; do
            if ! kubectl rollout status "deployment/$d" -n edu-app --timeout=300s; then
              echo "::error::Rollout $d thất bại — rollback"
              kubectl rollout undo "deployment/$d" -n edu-app
              exit 1
            fi
          done

      - name: Smoke test (readiness)
        if: steps.kubeconfig.outputs.has_cluster == 'true'
        run: |
          kubectl run "smoke-${DEPLOY_SHA:0:12}" -n edu-app --rm -i --restart=Never --image=curlimages/curl:8.10.1 -- \
            curl -fsS --retry 5 --retry-delay 3 http://api-gateway:3000/health/ready

  deploy-ssh-fallback:
    needs: deploy
    runs-on: ubuntu-24.04
    if: failure() && vars.ENABLE_SSH_FALLBACK == 'true'
    environment: production
    steps:
      - name: Deploy via SSH (fallback)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/edu_app
            git pull origin main
            docker compose pull && docker compose up -d --remove-orphans
            # Route health là /health (không có tiền tố /api — /api/health trả 404)
            sleep 10 && curl -f http://localhost/health || exit 1
