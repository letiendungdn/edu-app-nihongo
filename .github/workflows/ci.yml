name: CI

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks cần lịch sử để quét đúng khoảng commit
      # Quét secret trong các commit MỚI của push/PR (lịch sử cũ đã soát; ngoại lệ có lý do trong .gitleaks.toml)
      - name: Secret scan (gitleaks)
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "$BASE_REF"
            RANGE="origin/${BASE_REF}..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="${BEFORE}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "Quét khoảng commit: $RANGE"
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1             git /repo --config /repo/.gitleaks.toml --log-opts="$RANGE" --redact --no-banner --exit-code 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Chặn khi có lỗ hổng HIGH/CRITICAL ở dependency production (ngoại lệ có lý do trong audit-ci.jsonc)
      - name: Dependency audit (high+ blocks)
        run: npx --yes audit-ci@7 --config audit-ci.jsonc
      # Quét cấu hình (Dockerfile, K8s, Helm, Terraform): chặn HIGH/CRITICAL. Ngoại lệ có lý do trong .trivyignore.yaml
      - name: IaC / Dockerfile scan (trivy config)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.69.3 config . \
            --ignorefile .trivyignore.yaml --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs node_modules --skip-dirs apps/nihongo-web/.next
      # SAST: lỗi bảo mật trong code (TS/JS, Python, nginx, Terraform, workflow). Đường dẫn bỏ qua: .semgrepignore;
      # chỗ báo nhầm đơn lẻ ghi `nosemgrep` kèm lý do ngay tại dòng code. Ba luật tắt hẳn:
      #  - dynamic-proxy-host, missing-internal: proxy_pass dùng biến nhưng giá trị gán cứng (để Docker DNS cập nhật IP)
      #  - exported_activity: activity mở app và activity nhận redirect OAuth bắt buộc exported
      - name: SAST (semgrep)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.140.0 semgrep scan \
            --config p/default --config p/typescript --config p/nodejs --config p/secrets \
            --severity ERROR --severity WARNING --metrics=off --error \
            --exclude-rule generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host \
            --exclude-rule generic.nginx.security.missing-internal.missing-internal \
            --exclude-rule java.android.security.exported_activity.exported_activity
      # Chính sách cluster (Kyverno) chạy offline trên manifest: workload thật phải qua, pod root cố ý phải bị chặn
      - name: K8s policy check (kyverno)
        run: bash infra/k8s/policies/test.sh

  # Quét image thật sẽ chạy production. Deploy chỉ chạy khi CI xanh nên image có CVE CRITICAL đã có bản vá sẽ không lên.
  image-scan:
    name: image-scan (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            dockerfile: services/api-gateway/Dockerfile
          - name: content-service
            dockerfile: services/content-service/Dockerfile
          - name: exam-service
            dockerfile: services/exam-service/Dockerfile
          - name: signaling-service
            dockerfile: services/signaling-service/Dockerfile
          - name: nihongo-web
            dockerfile: apps/nihongo-web/Dockerfile
          - name: migrator
            dockerfile: packages/prisma-nihongo/Dockerfile.migrate
          - name: nginx
            dockerfile: infra/nginx/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=scan-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=scan-${{ matrix.name }}
      # Quét file tar (không mount docker.sock vào container Trivy). Chỉ chặn CVE đã có bản vá (--ignore-unfixed).
      - name: Trivy image scan (${{ matrix.name }})
        run: |
          docker run --rm -v "${{ runner.temp }}:/scan" -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" \
            aquasec/trivy:0.69.3 image --input /scan/image.tar --ignorefile /.trivyignore.yaml \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          docker run --rm -v "${{ runner.temp }}:/scan" aquasec/trivy:0.69.3 image --input /scan/image.tar \
            --severity HIGH --ignore-unfixed --exit-code 0 --no-progress --quiet

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nihongo
          POSTGRES_PASSWORD: nihongo
          POSTGRES_DB: nihongo
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run generate -w @edu/prisma-nihongo
      - run: npm run migrate:deploy -w @edu/prisma-nihongo
        env:
          DATABASE_URL: postgresql://nihongo:nihongo@localhost:5432/nihongo
      # Prisma tạo bảng xong mới tới Flyway tạo view/materialized view (infra/flyway/sql)
      - name: Flyway migrate (read model views)
        run: |
          docker run --rm --network host \
            -v "$PWD/infra/flyway/sql:/flyway/sql:ro" \
            flyway/flyway:10 \
            -url=jdbc:postgresql://localhost:5432/nihongo -user=nihongo -password=nihongo \
            -defaultSchema=flyway -schemas=flyway \
            migrate
      - run: npm run lint -w @edu/nihongo-services
      - run: npm test -w @edu/nihongo-services -- --coverage
        env:
          DATABASE_URL: postgresql://nihongo:nihongo@localhost:5432/nihongo
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          CONTENT_GRPC_URL: localhost:50051
          EXAM_GRPC_URL: localhost:50052
      # Test chạy SQL thật cho chỗ dễ đua nhau (trả tiền coach, đặt lịch, refresh token, cron nhiều pod)
      # và signaling thật (quyền vào phòng). DB riêng: test xóa dữ liệu.
      - name: DB integration tests
        run: |
          PGPASSWORD=nihongo psql -h localhost -U nihongo -d nihongo -c "CREATE DATABASE nihongo_test"
          DATABASE_URL=postgresql://nihongo:nihongo@localhost:5432/nihongo_test npm run migrate:deploy -w @edu/prisma-nihongo
          npm run test:db -w @edu/nihongo-services
        env:
          TEST_DATABASE_URL: postgresql://nihongo:nihongo@localhost:5432/nihongo_test
          REDIS_URL: redis://localhost:6379
      # Pipeline Airflow learner_insights: SQL chạy trên Postgres thật (Prisma + Flyway V1, V2) và cấu
      # trúc DAG, trong đúng image Airflow chạy thật (driver psycopg 3 của PostgresHook)
      - name: Airflow learner_insights tests
        run: |
          PGPASSWORD=nihongo psql -h localhost -U nihongo -d nihongo -c "CREATE DATABASE nihongo_insights_test"
          DATABASE_URL=postgresql://nihongo:nihongo@localhost:5432/nihongo_insights_test npm run migrate:deploy -w @edu/prisma-nihongo
          docker run --rm --network host -v "$PWD/infra/flyway/sql:/flyway/sql:ro" flyway/flyway:10 \
            -url=jdbc:postgresql://localhost:5432/nihongo_insights_test -user=nihongo -password=nihongo \
            -defaultSchema=flyway -schemas=flyway migrate
          docker run --rm --network host -v "$PWD/infra/airflow:/work" -w /work \
            -e PYTHONPATH=/work/dags \
            -e INSIGHTS_TEST_DATABASE_URL=postgresql://nihongo:nihongo@localhost:5432/nihongo_insights_test \
            --entrypoint bash apache/airflow:3.3.2-python3.12 \
            -c "pip install -q --user pytest==8.4.2 && python -m pytest -q -p no:cacheprovider tests"
      - name: Seed mock exam templates
        run: npm run seed:mock-exam-templates -w @edu/prisma-nihongo
        env:
          DATABASE_URL: postgresql://nihongo:nihongo@localhost:5432/nihongo
      - name: Start content and exam gRPC
        working-directory: services
        run: |
          node -r tsconfig-paths/register -r ts-node/register content-service/src/main.ts > /tmp/content-grpc.log 2>&1 &
          node -r tsconfig-paths/register -r ts-node/register exam-service/src/main.ts > /tmp/exam-grpc.log 2>&1 &
          for _ in $(seq 1 40); do
            if grep -q "Content service listening" /tmp/content-grpc.log && grep -q "Exam service listening" /tmp/exam-grpc.log; then
              exit 0
            fi
            sleep 2
          done
          echo "----- content -----"; cat /tmp/content-grpc.log
          echo "----- exam -----"; cat /tmp/exam-grpc.log
          exit 1
        env:
          DATABASE_URL: postgresql://nihongo:nihongo@localhost:5432/nihongo
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          EXAM_CONSUMER_DISABLED: "true"
          OTEL_SDK_DISABLED: "true"
      - run: npm run test:e2e -w @edu/nihongo-services
        env:
          DATABASE_URL: postgresql://nihongo:nihongo@localhost:5432/nihongo
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          STRIPE_SECRET_KEY: sk_test_ci
          GEMINI_API_KEY: test-key
          MONGODB_ENABLED: "off"
          CONTENT_GRPC_URL: localhost:50051
          EXAM_GRPC_URL: localhost:50052
      - run: npm run build:all -w @edu/nihongo-services

  nihongo-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint -w @edu/nihongo-web
      - run: npm run test:run -w @edu/nihongo-web
      - run: npm run build -w @edu/nihongo-web
        env:
          API_URL: http://localhost:3000
      # Thư viện nặng (socket.io, oidc, hls.js, recharts…) không được lọt vào layout gốc. Xem docs/learn-webpack.md
      - run: npm run bundle:report -w @edu/nihongo-web

  # ── Android: unit test (JVM) + bản release qua R8 ───────────────────────────
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/nihongo-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # AGP 8.7 / Kotlin 2.0 cần JDK 17 (JDK mới hơn làm Kotlin không đọc được phiên bản)
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: chmod +x gradlew
      - name: Unit test
        run: ./gradlew testDebugUnitTest
      # Build release để bắt sớm lỗi R8 (thiếu quy tắc giữ class) trước khi tới tay người dùng
      - name: Release build (R8)
        run: ./gradlew assembleRelease
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unit-test-report
          path: apps/nihongo-android/app/build/reports/tests/

  # ── Android: test trên emulator (migration Room, Compose UI, deep link, Worker, widget) ──
  android-instrumented:
    runs-on: ubuntu-24.04
    needs: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Runner Linux có KVM nhưng mặc định không cho user dùng: thiếu bước này emulator chạy cực chậm
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: apps/nihongo-android
          script: chmod +x gradlew && ./gradlew connectedDebugAndroidTest
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-instrumented-report
          path: apps/nihongo-android/app/build/reports/androidTests/

  # ── Flutter: analyze + test (CI cũ không có job này: test smoke đỏ từ lâu mà không ai biết) ──
  flutter:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/nihongo_flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      # Code Drift tự sinh (*.g.dart) được commit: phải khớp với schema hiện tại
      - name: Generated code up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib
      - run: flutter analyze
      # Test integration (cần backend thật) tự bỏ qua khi không đặt INTEGRATION=1
      - run: flutter test

  # ── iOS: unit test + UI test trên simulator (cần runner macOS) ──────────────
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/nihongo-ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Sinh lại .xcodeproj từ project.yml: CI luôn build đúng cấu hình trong project.yml,
      # kể cả khi ai đó quên chạy xcodegen trước khi commit file project
      - run: brew install xcodegen
      # Bỏ LiveKit trên CI: binary WebRTC/UniFFI hay lỗi SPM "already exists in file system".
      # Unit/UI test không cần phòng live; máy local vẫn `xcodegen generate` đủ LiveKit.
      - name: Generate Xcode project (no LiveKit)
        run: |
          python3 ci/strip-livekit-for-ci.py
          xcodegen generate --spec project.ci.yml
      # Tên simulator đổi theo phiên bản image của runner: chọn iPhone đầu tiên có sẵn
      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E "iPhone" | grep -oE "[0-9A-F-]{36}")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Unit test
        run: xcodebuild test -project NihongoEDU.xcodeproj -scheme NihongoEDU -destination "id=$SIM_UDID" -only-testing:NihongoEDUTests
      # UI test luồng offline (deep link, kana); bỏ test đo khởi động vì runner CI quá nhiễu
      - name: UI test
        run: >
          xcodebuild test -project NihongoEDU.xcodeproj -scheme NihongoEDU -destination "id=$SIM_UDID"
          -only-testing:NihongoEDUUITests -skip-testing:NihongoEDUUITests/NihongoEDUUITests/testLaunchPerformance
      - name: Release build
        run: xcodebuild build -project NihongoEDU.xcodeproj -scheme NihongoEDU -configuration Release -destination "generic/platform=iOS Simulator"
